# Consolidated nforcer multimap symbols.
# Keep symbol definitions local; maps can remain remote URLs.

multimap_whitelist_email {
  type = "from";
  filter = "email:addr";
  map = "https://raw.githubusercontent.com/nforceroh/rspamd_config/main/maps.d/whitelist.email.map";
  score = -50.0;
  symbol = "multimap_whitelist_email";
  description = "Email address whitelist";
  one_shot = true;
}

multimap_whitelist_domain {
  type = "from";
  filter = "email:domain";
  map = "https://raw.githubusercontent.com/nforceroh/rspamd_config/main/maps.d/whitelist.domain.map";
  score = -50.0;
  symbol = "multimap_whitelist_domain";
  description = "Domain whitelist";
  regexp = true;
  one_shot = true;
  require_symbols = "R_SPF_ALLOW | R_DKIM_ALLOW";
}

multimap_blacklist_email {
  type = "from";
  filter = "email:addr";
  map = "https://raw.githubusercontent.com/nforceroh/rspamd_config/main/maps.d/blacklist.email.map";
